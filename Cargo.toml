[package]
name = "robotface_offloader"
version = "0.6.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
md5 = "0.7"
num_cpus = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.30"
time = { version = "0.3", features = ["formatting"] }
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
